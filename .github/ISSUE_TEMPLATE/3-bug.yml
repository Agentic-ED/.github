name: Bug
description: Something in a skill or agent isn't working as it should.
type: Bug
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can someone see it happen?
      description: The steps, the input you gave and the assistant you used.
      placeholder: |
        1. Installed the skill in Claude.
        2. Asked it to align a 6-module course.
        3. It skipped module 4.
    validations:
      required: true
  - type: input
    id: skill
    attributes:
      label: Which skill or agent, and which version?
      placeholder: "assessment-alignment@1.0.0"
    validations:
      required: true
  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow the [Code of Conduct](https://agentic-ed.org/code-of-conduct).
          required: true
