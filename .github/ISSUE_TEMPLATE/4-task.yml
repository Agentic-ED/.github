name: Task
description: A piece of work that isn't a feature or a bug, such as documentation, tests or tidying up.
type: Task
body:
  - type: textarea
    id: what
    attributes:
      label: What needs doing?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How anyone can tell it's finished.
    validations:
      required: true
  - type: input
    id: project
    attributes:
      label: Part of a project?
      description: Link the project issue, if there is one. Optional.
      placeholder: "#57"
  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow the [Code of Conduct](https://agentic-ed.org/code-of-conduct).
          required: true
